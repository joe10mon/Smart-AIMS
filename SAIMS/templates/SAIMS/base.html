<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart AIMS{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa; --surface: #ffffff; --text: #1f2933; --muted: #5b6675;
      --line: #dde1e7; --accent: #1d4ed8; --error: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151a; --surface: #1a1f27; --text: #e6e9ee; --muted: #9aa4b2;
        --line: #2a303a; --accent: #8ab4ff; --error: #ff8a80;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .bar { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: center;
           justify-content: space-between; padding: .75rem 1.25rem;
           background: var(--surface); border-bottom: 1px solid var(--line); }
    .brand { font-weight: 650; color: var(--text); text-decoration: none; }
    .who { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
    .who form { margin: 0; }
    .role { border: 1px solid var(--line); border-radius: 4px; padding: 0 .4rem; color: var(--muted); font-size: .875rem; }
    button { font: inherit; cursor: pointer; }
    button.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; }
    main { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1.25rem; }
    h2 { font-size: 1.1rem; margin: 2rem 0 .5rem; }
    .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: .9rem; }
    tr:last-child td { border-bottom: 0; }
    @media (max-width: 480px) {
      main { padding-left: .75rem; padding-right: .75rem; }
      th, td { padding: .5rem .45rem; font-size: .9rem; }
    }
    .empty { color: var(--muted); margin: .25rem 0; }
    .auth { max-width: 24rem; margin: 3rem auto 0; }
    .auth label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
    .auth input[type=text], .auth input[type=password] {
      width: 100%; padding: .55rem .65rem; font: inherit; color: var(--text);
      background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
    .auth button { margin-top: 1.25rem; padding: .6rem 1.1rem; border: 0; border-radius: 6px;
                   background: var(--accent); color: var(--bg); font-weight: 600; }
    .error { color: var(--error); margin: 0 0 1rem; }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="{% url 'home' %}">Smart AIMS</a>
    {% if user.is_authenticated %}
      <div class="who">
        <span>{{ user.get_full_name|default:user.username }}</span>
        <span class="role">{{ user.get_role_display }}</span>
        {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin panel</a>{% endif %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="link">Log out</button>
        </form>
      </div>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
